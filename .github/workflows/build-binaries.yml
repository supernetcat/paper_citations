name: build-binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build binary
        shell: bash
        run: python -m PyInstaller --clean --noconfirm paper-citations.spec

      - name: Rename per platform
        shell: bash
        run: |
          cd dist
          case "$(uname -s)" in
            Linux*)  mv paper-citations paper-citations-linux-x86_64 ;;
            Darwin*)
              if [ "$(uname -m)" = "arm64" ]; then mv paper-citations paper-citations-darwin-arm64; else mv paper-citations paper-citations-darwin-x86_64; fi ;;
            MINGW*|MSYS*|CYGWIN*) mv paper-citations.exe paper-citations-windows-x86_64.exe ;;
          esac
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-citations-${{ matrix.os }}
          path: dist/paper-citations*

      - name: Attach to GitHub Release (tagged only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/paper-citations*
          overwrite: true
